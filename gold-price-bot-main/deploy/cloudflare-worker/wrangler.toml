name = "gold-price-bot"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# کرن هر دقیقه — پلن رایگان تا ۵ تریگر در هر اکانت اجازه می‌دهد
[triggers]
crons = ["* * * * *"]

# بعد از ساخت KV این بخش را فعال کن (قدم ۳ راهنما):
# [[kv_namespaces]]
# binding = "STATE"
# id = "آی‌دی-namespace-ای-که-ساختی"

[observability]
enabled = true
